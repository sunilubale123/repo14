name: practice workflow
on:
  push:
    branches:
      - main


jobs:
  extract_data:
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      uses: actions/checkout@v2
    - name: run extract_data.py
      run: python extract_data.py

  transform_data:
    runs-on: ubuntu-latest
    needs: extract_data
    steps:
    - name: checkout code
      uses: actions/checkout@v2
    - name: run transform_data
      run: python transform_data.py

  load_data:
    runs-on: ubuntu-latest
    needs: extract_data
    steps: 
    - name: checkout code
      uses: actions/checkout@v2
    - name: run load_data.py
      run: python load_data.py

  print_data:
    runs-on: ubuntu-latest
    needs: load_data
    needs: transform_data
    steps:
    - name: checkout code
      uses: actions/checkout@v2
    - name: run print_data.py
      run: python print_data.py   